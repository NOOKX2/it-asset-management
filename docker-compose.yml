services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: itam
      POSTGRES_PASSWORD: itam_password
      POSTGRES_DB: itam
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itam -d itam"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: it_asset_management-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://itam:itam_password@db:5432/itam
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  studio:
    image: it_asset_management-app
    restart: unless-stopped
    entrypoint: ["npx"]
    command:
      - prisma
      - studio
      - --config
      - ./prisma.config.ts
      - --port
      - "5555"
      - --browser
      - none
    ports:
      - "5555:5555"
    environment:
      DATABASE_URL: postgresql://itam:itam_password@db:5432/itam
      HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
